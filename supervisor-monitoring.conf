; /etc/supervisor/conf.d/laravel-worker-monitoring.conf
;
; Supervisor config for Laravel queue workers — monitoring queue.
; Runs 5 parallel workers to process health checks concurrently.
;
; After editing, run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker-monitoring:*

[program:laravel-worker-monitoring]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/devops-helper/artisan queue:work database --queue=monitoring --sleep=3 --tries=1 --timeout=150 --max-jobs=500
autostart=true
autorestart=true
user=www-data
numprocs=5
redirect_stderr=true
stdout_logfile=/var/www/devops-helper/storage/logs/worker-monitoring.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
